name: Deploy Homelab - API

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Cloud (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir Nome da Imagem em Minúsculas
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Compilar e Enviar Imagem Docker para o GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Homelab (BMO)
    needs: build-and-push
    runs-on: [self-hosted]
    steps:
      - name: Autenticar no GHCR no Runner Local
        run: |
          echo "🔑 Autenticando Docker no GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Backup da Imagem Atual (Rollback Safety)
        run: |
          if docker image inspect capihouse-api:latest >/dev/null 2>&1; then
            echo "💾 Imagem atual encontrada. Criando tag capihouse-api:rollback-backup..."
            docker tag capihouse-api:latest capihouse-api:rollback-backup
          else
            echo "ℹ️ Nenhuma imagem capihouse-api:latest existente para backup prévio."
          fi

      - name: Baixar Nova Imagem do GHCR
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          echo "📥 Baixando imagem compilada na nuvem: $IMAGE_NAME..."
          docker pull "$IMAGE_NAME"
          docker tag "$IMAGE_NAME" capihouse-api:latest

      - name: Executar Deploy Zero-Downtime Blue-Green
        run: |
          TARGET_DIR="${{ vars.CAPIHOUSE_DIR }}"
          if [ -z "$TARGET_DIR" ]; then
            if [ -n "$CAPIHOUSE_DIR" ]; then
              TARGET_DIR="$CAPIHOUSE_DIR"
            elif [ -f "$HOME/homelab/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/homelab/capihouse"
            elif [ -f "/opt/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="/opt/capihouse"
            elif [ -f "$HOME/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/capihouse"
            elif [ -f "../docker-compose.yml" ]; then
              TARGET_DIR=".."
            else
              TARGET_DIR="."
            fi
          fi

          if [ -f "$TARGET_DIR/scripts/deploy-blue-green.sh" ]; then
            echo "🚀 Executando Deploy Zero-Downtime via scripts/deploy-blue-green.sh..."
            chmod +x "$TARGET_DIR/scripts/deploy-blue-green.sh"
            bash "$TARGET_DIR/scripts/deploy-blue-green.sh" api
          else
            echo "ℹ️ Modo legado: scripts/deploy-blue-green.sh não encontrado em $TARGET_DIR. Atualizando via docker compose..."
            if [ -f "$TARGET_DIR/docker-compose.yml" ]; then
              docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps capihouse-api capihouse-reverb
            else
              docker restart capihouse-api capihouse-reverb || echo "Contêineres não estavam em execução."
            fi

            echo "🩺 Verificando integridade no modo legado..."
            API_PORT=$(docker port capihouse-api 8000/tcp 2>/dev/null | head -n 1 | awk -F: '{print $NF}' || echo "8000")
            API_PORT="${API_PORT:-8000}"
            HEALTHY=false
            for i in {1..15}; do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' capihouse-api 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=true
                break
              fi
              if [ "$STATUS" = "running" ]; then
                if command -v curl >/dev/null 2>&1; then
                  HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${API_PORT}/up" || echo "000")
                  if [ "$HTTP_CODE" = "200" ]; then
                    HEALTHY=true
                    break
                  fi
                fi
              fi
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "🚨 Falha na verificação de integridade! Executando rollback..."
              docker logs --tail 30 capihouse-api || true
              if docker image inspect capihouse-api:rollback-backup >/dev/null 2>&1; then
                docker tag capihouse-api:rollback-backup capihouse-api:latest
                docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps capihouse-api capihouse-reverb
              fi
              exit 1
            fi
          fi

      - name: Limpeza de Imagens Antigas (Prune)
        if: always()
        run: |
          echo "🧹 Limpando imagens órfãs ou antigas..."
          docker image prune -f || true
