name: Deploy Homelab - API

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy capihouse-api
    runs-on: [self-hosted]
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Backup da Imagem Atual (Rollback Safety)
        run: |
          if docker image inspect capihouse-api:latest >/dev/null 2>&1; then
            echo "💾 Imagem atual encontrada. Criando tag capihouse-api:rollback-backup..."
            docker tag capihouse-api:latest capihouse-api:rollback-backup
          else
            echo "ℹ️ Nenhuma imagem capihouse-api:latest existente para backup prévio."
          fi

      - name: Build da Imagem Docker
        run: |
          echo "🔨 Iniciando compilação da imagem Docker do capihouse-api..."
          docker build \
            --tag capihouse-api:latest \
            --tag capihouse-api:${{ github.sha }} \
            -f Dockerfile .

      - name: Deploy no Docker Compose
        run: |
          TARGET_DIR="${{ vars.CAPIHOUSE_DIR }}"
          if [ -z "$TARGET_DIR" ]; then
            if [ -n "$CAPIHOUSE_DIR" ]; then
              TARGET_DIR="$CAPIHOUSE_DIR"
            elif [ -f "$HOME/homelab/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/homelab/capihouse"
            elif [ -f "/opt/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="/opt/capihouse"
            elif [ -f "$HOME/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/capihouse"
            elif [ -f "../docker-compose.yml" ]; then
              TARGET_DIR=".."
            else
              TARGET_DIR="."
            fi
          fi

          echo "🚀 Atualizando serviços capihouse-api e capihouse-reverb no Docker Compose em: $TARGET_DIR"
          if [ -f "$TARGET_DIR/docker-compose.yml" ]; then
            docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps capihouse-api capihouse-reverb
          else
            echo "⚠️ docker-compose.yml não encontrado em $TARGET_DIR. Tentando reiniciar contêineres diretamente..."
            docker restart capihouse-api capihouse-reverb || echo "Contêineres não estavam em execução."
          fi

      - name: Verificar Integridade com Rollback Automático
        run: |
          echo "🩺 Verificando integridade da aplicação..."
          API_PORT=$(docker port capihouse-api 8000/tcp 2>/dev/null | head -n 1 | awk -F: '{print $NF}' || echo "8000")
          API_PORT="${API_PORT:-8000}"
          echo "Porta pública detectada: $API_PORT"

          HEALTHY=false
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' capihouse-api 2>/dev/null || echo "not_found")
            echo "Tentativa $i/15 - Status do container: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ API reportou status saudável (healthy)!"
              HEALTHY=true
              break
            fi
            if [ "$STATUS" = "running" ]; then
              if command -v curl >/dev/null 2>&1; then
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${API_PORT}/up" || echo "000")
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "✅ API respondendo com sucesso no endpoint /up (HTTP 200)!"
                  HEALTHY=true
                  break
                fi
              fi
            fi
            sleep 5
          done

          if [ "$HEALTHY" = true ]; then
            echo "🎉 Deploy concluído e validado com sucesso!"
            exit 0
          fi

          echo "🚨 FALHA CRÍTICA: A nova versão da API não respondeu com sucesso dentro do tempo limite!"
          echo "📋 Últimos logs do container com falha:"
          docker logs --tail 40 capihouse-api || true

          TARGET_DIR="${{ vars.CAPIHOUSE_DIR }}"
          if [ -z "$TARGET_DIR" ]; then
            if [ -n "$CAPIHOUSE_DIR" ]; then
              TARGET_DIR="$CAPIHOUSE_DIR"
            elif [ -f "$HOME/homelab/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/homelab/capihouse"
            elif [ -f "/opt/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="/opt/capihouse"
            elif [ -f "$HOME/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/capihouse"
            elif [ -f "../docker-compose.yml" ]; then
              TARGET_DIR=".."
            else
              TARGET_DIR="."
            fi
          fi

          if docker image inspect capihouse-api:rollback-backup >/dev/null 2>&1; then
            echo "⏪ Iniciando ROLLBACK AUTOMÁTICO para a versão anterior estável..."
            docker tag capihouse-api:rollback-backup capihouse-api:latest
            if [ -f "$TARGET_DIR/docker-compose.yml" ]; then
              docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps capihouse-api capihouse-reverb
            else
              docker restart capihouse-api capihouse-reverb || true
            fi
            echo "🛡️ Rollback executado com sucesso! A versão anterior estável está ativa no ar."
          else
            echo "⚠️ Imagem de backup 'capihouse-api:rollback-backup' não encontrada para restaurar."
          fi

          exit 1

      - name: Limpeza de Imagens Antigas (Prune)
        if: always()
        run: |
          echo "🧹 Limpando imagens órfãs ou antigas..."
          docker image prune -f || true
